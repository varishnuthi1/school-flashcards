<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>Varish's Flashcards</title>
<style>
:root{
  --bg:#0b1120; --bg2:#111a2e;
  --surface:#18233c; --surface2:#233150; --surface3:#2e3f66;
  --line:#2c3a5c;
  --text:#eef2ff; --muted:#93a3c4; --dim:#6c7d9f;
  --accent:#6366f1; --accent2:#818cf8;
  --green:#22c55e; --greenbg:#0f3823;
  --red:#ef4444; --redbg:#3d1216;
  --amber:#f59e0b;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(900px 500px at 15% -10%, #1b2a4d 0%, transparent 60%),
                   radial-gradient(700px 500px at 100% 0%, #1a2340 0%, transparent 55%);
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.screen{display:none}
.screen.on{display:block}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px}

/* ---------- HOME ---------- */
.hero{text-align:center;padding:18px 0 30px}
.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:.9rem;margin-top:6px}
.hero .totals{display:inline-flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.pill{background:var(--surface);border:1px solid var(--line);color:var(--muted);
  font-size:.75rem;padding:5px 12px;border-radius:99px}
.pill b{color:var(--text)}

.group{background:rgba(24,35,60,.72);border:1px solid var(--line);
  border-radius:18px;margin-bottom:18px;overflow:hidden;backdrop-filter:blur(8px)}
.group-head{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}
.group-head .ic{font-size:1.25rem;line-height:1}
.group-head .nm{font-weight:700;font-size:1.02rem;letter-spacing:-.01em}
.group-head .ct{margin-left:auto;font-size:.72rem;color:var(--dim)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px;padding:15px}

.course{position:relative;background:var(--surface2);border:1px solid transparent;
  border-radius:var(--radius);padding:15px 14px 14px;text-align:left;width:100%;
  color:var(--text);cursor:pointer;transition:transform .16s,border-color .16s,background .16s;overflow:hidden}
.course:hover:not(.soon){transform:translateY(-3px);border-color:var(--accent);background:var(--surface3)}
.course:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.course .stripe{position:absolute;inset:0 0 auto 0;height:3px}
.course .cnm{font-weight:650;font-size:.93rem;margin-bottom:5px;letter-spacing:-.01em}
.course .cmeta{font-size:.76rem;color:var(--muted)}
.course .cbar{margin-top:10px;height:5px;background:#16203a;border-radius:99px;overflow:hidden}
.course .cbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.course .cpct{font-size:.68rem;color:var(--dim);margin-top:5px}
.course.soon{opacity:.45;cursor:default}
.badge{display:inline-block;background:#3a4665;color:#9fb0d4;font-size:.6rem;font-weight:700;
  letter-spacing:.06em;padding:3px 9px;border-radius:99px;text-transform:uppercase}

/* ---------- STUDY ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(11,17,32,.93);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:11px 16px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text);
  padding:7px 13px;border-radius:10px;cursor:pointer;font-size:.82rem;font-weight:550;transition:.15s;white-space:nowrap}
.ghost:hover{background:var(--surface2);border-color:var(--surface3)}
.titles{flex:1 1 140px;min-width:0}
.titles .t1{font-weight:700;font-size:.93rem;letter-spacing:-.01em}
.titles .t2{font-size:.73rem;color:var(--muted)}
.ctrls{display:flex;align-items:center;gap:8px;margin-left:auto}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--muted);padding:6px 14px;
  border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.4)}
.solid{background:var(--accent);border:none;color:#fff;padding:7px 14px;border-radius:10px;
  cursor:pointer;font-size:.82rem;font-weight:600;transition:.15s;white-space:nowrap}
.solid:hover{background:var(--accent2)}

.tabrow{max-width:900px;margin:0 auto;display:flex;gap:7px;flex-wrap:nowrap;
  overflow-x:auto;overflow-y:hidden;padding:11px 16px 1px;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.tabrow::-webkit-scrollbar{display:none}
.tabrow.sub{padding-top:7px}
.tab{flex:0 0 auto;white-space:nowrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  padding:6px 13px;border-radius:99px;cursor:pointer;font-size:.79rem;font-weight:550;transition:.15s}
.tab:hover{border-color:var(--surface3);color:var(--text)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .n{opacity:.65;font-size:.72rem;margin-left:4px}
.tab.sub{font-size:.75rem;padding:5px 11px;background:transparent}
.tab.sub.on{background:var(--surface3);border-color:var(--surface3);color:var(--text)}

.filters{max-width:900px;margin:0 auto;display:flex;gap:7px;flex-wrap:nowrap;align-items:center;
  overflow-x:auto;overflow-y:hidden;padding:10px 16px 9px;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filters .lbl{font-size:.72rem;color:var(--dim);margin-right:2px;flex:0 0 auto}
.chip{flex:0 0 auto;white-space:nowrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);
  padding:4px 11px;border-radius:99px;cursor:pointer;font-size:.74rem;transition:.15s}
.chip.on{background:var(--surface3);color:var(--text);border-color:var(--surface3)}
.chip:disabled{opacity:.35;cursor:not-allowed}

.stage{max-width:660px;margin:0 auto;padding:16px}

/* progress */
.bar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:9px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-bottom:14px}
.meta .rt{display:flex;gap:11px}
.meta .ok{color:var(--green)}
.meta .lr{color:var(--amber)}

/* card */
.flipbox{perspective:1400px;margin-bottom:16px;cursor:pointer}
.flipper{position:relative;width:100%;min-height:230px;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.flipper.flipped{transform:rotateY(180deg)}
.face{position:absolute;top:0;left:0;width:100%;min-height:230px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 26px;text-align:center;gap:12px}
.face.is-front{background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.face.is-back{background:linear-gradient(160deg,#1b2f52,#1a2748);border:1px solid #33507f;
  transform:rotateY(180deg);box-shadow:0 10px 30px rgba(0,0,0,.28)}
/* width:100% matters — the faces are flex columns with align-items:center, so
   without it these shrink-wrap to max-content and long answers run off-screen
   instead of wrapping. */
.q,.a{width:100%;max-width:100%;overflow-wrap:break-word;word-break:break-word}
.q{font-size:1.22rem;font-weight:650;line-height:1.45;letter-spacing:-.01em}
.a{font-size:1.04rem;line-height:1.62;color:#cfe4ff}
.tiny{font-size:.7rem;color:var(--dim);letter-spacing:.03em}
.tagline{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{font-size:.63rem;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);letter-spacing:.04em}
.tag.star{background:#3d2f08;color:#fbbf24}
.tag.known{background:var(--greenbg);color:#6ee7a0}
.tag.learn{background:#40300a;color:#fcd34d}
.tag.tip{background:#28304f;color:#a5b4fc}

.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.b{border:none;padding:10px 17px;border-radius:11px;cursor:pointer;font-size:.85rem;
  font-weight:600;transition:.15s;white-space:nowrap}
.b.nav{background:var(--surface2);color:var(--text)}
.b.nav:hover{background:var(--surface3)}
.b.primary{background:var(--accent);color:#fff}
.b.primary:hover{background:var(--accent2)}
.b.ok{background:var(--greenbg);color:#6ee7a0;border:1px solid #1e6b45}
.b.ok:hover{background:#155035}
.b.lrn{background:#3a2c08;color:#fcd34d;border:1px solid #7a5c10}
.b.lrn:hover{background:#4a3a0c}
.b.quiet{background:transparent;color:var(--dim);border:1px solid var(--line)}
.b.quiet:hover{color:var(--text);border-color:var(--surface3)}
.b:disabled{opacity:.4;cursor:not-allowed}
.icobtn{background:transparent;border:1px solid var(--line);border-radius:11px;
  font-size:1.05rem;cursor:pointer;padding:9px 13px;transition:.15s;line-height:1}
.icobtn:hover{background:var(--surface2)}

/* test */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:30px 26px;text-align:center;font-size:1.18rem;font-weight:650;line-height:1.45;
  min-height:140px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.24);word-break:break-word}
.qhint{text-align:center;font-size:.73rem;color:var(--dim);margin-bottom:14px}
.inp{width:100%;background:var(--surface2);border:2px solid var(--line);color:var(--text);
  border-radius:12px;padding:13px 16px;font-size:1rem;outline:none;transition:.15s;font-family:inherit}
.inp::placeholder{color:var(--dim)}
.inp:focus{border-color:var(--accent);background:var(--surface3)}
.inp:disabled{opacity:.75}
.res{border-radius:13px;padding:16px 18px;margin:14px 0;text-align:left}
.res.good{background:var(--greenbg);border:1px solid #2a7a4f}
.res.bad{background:var(--redbg);border:1px solid #8a2f34}
.res .hd{font-weight:700;margin-bottom:8px;font-size:.98rem}
.res .yours{font-size:.82rem;color:var(--muted);margin-bottom:7px;word-break:break-word}
.res .ans{font-size:.96rem;line-height:1.6;word-break:break-word}
.res .ans b{color:var(--muted);font-weight:600;font-size:.8rem;display:block;margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.06em}

.score{text-align:center;padding:34px 16px}
.score .big{font-size:3.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.score .pct{font-size:1rem;color:var(--muted);margin:8px 0 4px}
.score .msg{color:var(--dim);font-size:.88rem;margin-bottom:22px}
.missed{text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;margin:20px 0;max-height:280px;overflow-y:auto}
.missed h4{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:11px}
.missed li{list-style:none;padding:9px 0;border-top:1px solid var(--line);font-size:.86rem;line-height:1.5}
.missed li:first-of-type{border-top:none}
.missed li .mq{font-weight:600}
.missed li .ma{color:var(--muted);font-size:.82rem}

.empty{text-align:center;color:var(--dim);padding:70px 20px;font-size:.92rem}
.kbd{max-width:660px;margin:22px auto 0;padding:0 16px;text-align:center;font-size:.7rem;color:var(--dim)}
.kbd span{display:inline-block;background:var(--surface2);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;margin:0 2px;font-family:ui-monospace,monospace}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--surface3);border:1px solid var(--line);color:var(--text);
  padding:10px 18px;border-radius:99px;font-size:.83rem;opacity:0;pointer-events:none;
  transition:.25s;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:560px){
  .wrap{padding:16px 13px 50px}
  .topbar-in{gap:8px;padding:9px 13px}
  .titles{flex:1 1 auto}
  .titles .t1,.titles .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrls{width:100%;margin-left:0}
  .ctrls .solid{margin-left:auto}
  .tabrow,.filters{padding-left:13px;padding-right:13px}
  .hero h1{font-size:1.5rem}
  .courses{grid-template-columns:1fr 1fr;gap:10px;padding:12px}
  .course{padding:13px 11px}
  .course .cnm{font-size:.84rem}
  .course .cmeta{font-size:.7rem}
  .stage{padding:14px 13px}
  .q{font-size:1.08rem}
  .a{font-size:.97rem}
  .face{padding:24px 18px;min-height:210px}
  .flipper{min-height:210px}
  .qbox{font-size:1.06rem;padding:24px 18px}
  .titles .t1{font-size:.86rem}
  .kbd{display:none}
}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div id="home" class="screen on">
  <div class="wrap">
    <div class="hero">
      <h1>Varish's Flashcards</h1>
      <p>Hickory Ridge High School &middot; Freshman Year</p>
      <div class="totals" id="totals"></div>
    </div>
    <div id="groups"></div>
  </div>
</div>

<!-- ============ UNIT PICKER ============ -->
<div id="units" class="screen">
  <div class="topbar"><div class="topbar-in">
    <button class="ghost" onclick="goHome()">&larr; Home</button>
    <div class="titles"><div class="t1" id="u-title"></div><div class="t2">Pick a unit</div></div>
  </div></div>
  <div class="wrap"><div id="unit-list" class="courses" style="padding:0"></div></div>
</div>

<!-- ============ STUDY ============ -->
<div id="study" class="screen">
  <div class="topbar">
    <div class="topbar-in">
      <button class="ghost" onclick="exitStudy()">&larr; Back</button>
      <div class="titles">
        <div class="t1" id="s-title"></div>
        <div class="t2" id="s-sub"></div>
      </div>
      <div class="ctrls">
        <div class="seg">
          <button id="m-flash" class="on" onclick="setMode('flash')">Cards</button>
          <button id="m-test" onclick="setMode('test')">Test</button>
        </div>
        <button class="solid" onclick="exportAnki()">&darr; Anki</button>
      </div>
    </div>
    <div class="tabrow" id="tabs"></div>
    <div class="tabrow sub" id="subtabs"></div>
    <div class="filters" id="filters"></div>
  </div>
  <div id="flashStage" class="stage"></div>
  <div id="testStage" class="stage" style="display:none"></div>
  <div class="kbd" id="kbdhint"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   DECK DATA
   Card fields:
     sec    - section key (required)
     sub    - sub-section key (optional)
     q      - front / question
     a      - back / answer   ("\n" = new line, " / " = alternate answers)
     star   - true = high priority
     tip    - true = memory trick card (not a definition)
     accept - extra answers the test mode should count as correct
     hint   - grey helper line under the test input
   ===================================================================== */
const GROUPS = [

/* ================== MATHEMATICS ================== */
{key:"math", label:"Mathematics", icon:"\u{1F4D0}", color:"#f59e0b", courses:[

  {key:"math3", label:"Math 3 Honors", units:[
    {key:"u2logs", label:"Unit 2: Logarithm Rules",
     sections:[
       {key:"def",   label:"Definition & Basics"},
       {key:"rules", label:"The Rules"},
       {key:"apply", label:"Expand & Condense"}
     ],
     cards:[
      /* --- DEFINITION --- */
      {sec:"def", star:true, q:"Definition of a logarithm",
       a:"logₐ(x) = y  means  aʸ = x\nA log ASKS: “What exponent do I put on the base to get this number?”",
       accept:["a to the y equals x","exponent you raise the base to","it asks what exponent gives you x","the inverse of an exponential"],
       hint:"Answer in words — what does a log ask you?"},
      {sec:"def", q:"Evaluate: log₂(8)",
       a:"3\nBecause 2³ = 8", accept:["3","three"]},
      {sec:"def", q:"Evaluate: log₅(25)",
       a:"2\nBecause 5² = 25", accept:["2","two"]},
      {sec:"def", q:"What is a COMMON logarithm?",
       a:"A log with base 10, written log(x) with no base shown.\nlog(1000) = 3 because 10³ = 1000",
       accept:["base 10","log base ten","log with no base written"]},
      {sec:"def", q:"What is a NATURAL logarithm?",
       a:"A log with base e (≈ 2.718), written ln(x).\nln(e) = 1 and ln(1) = 0",
       accept:["base e","log base e","ln"]},
      {sec:"def", q:"What values are ALLOWED inside a logarithm?",
       a:"Only positive numbers. The argument must be > 0.\nlog(0) and log(negative) are UNDEFINED. The base must also be positive and ≠ 1.",
       accept:["positive numbers only","greater than zero","only positives"]},

      /* --- RULES --- */
      {sec:"rules", star:true, q:"Product Rule",
       a:"logₐ(MN) = logₐ(M) + logₐ(N)\nA product inside turns into ADDITION outside.",
       accept:["multiply inside becomes add outside","product becomes a sum","add the logs","log m plus log n"],
       hint:"Say it in words if the symbols are hard to type"},
      {sec:"rules", star:true, q:"Quotient Rule",
       a:"logₐ(M/N) = logₐ(M) − logₐ(N)\nDivision inside turns into SUBTRACTION outside.",
       accept:["divide inside becomes subtract outside","quotient becomes a difference","subtract the logs","log m minus log n"],
       hint:"Say it in words if the symbols are hard to type"},
      {sec:"rules", star:true, q:"Power Rule",
       a:"logₐ(Mᵖ) = p · logₐ(M)\nAn exponent inside comes DOWN in front and multiplies.",
       accept:["exponent comes down in front","bring the exponent down and multiply","move the power to the front"],
       hint:"Say it in words if the symbols are hard to type"},
      {sec:"rules", q:"Identity Rule",
       a:"logₐ(a) = 1\nWhen the inside matches the base, the answer is always 1.",
       accept:["1","equals 1","it is one","log of the base is one"]},
      {sec:"rules", q:"Zero Rule",
       a:"logₐ(1) = 0\nThe log of 1 is always 0, no matter the base.",
       accept:["0","equals 0","it is zero","log of one is zero"]},
      {sec:"rules", q:"Inverse Property (exponential undoes a log)",
       a:"a^(logₐ x) = x\nRaising the base to a log of that same base cancels out.",
       accept:["they cancel out","you get x back","the base and the log undo each other"]},
      {sec:"rules", q:"Inverse Property (log undoes an exponential)",
       a:"logₐ(aˣ) = x\nA log of the base raised to a power gives back just the exponent.",
       accept:["you get x back","they cancel","it gives the exponent"]},
      {sec:"rules", star:true, q:"Change of Base Formula",
       a:"logₐ(x) = log(x) / log(a) = ln(x) / ln(a)\nLets you put ANY log into a calculator.",
       accept:["log x over log a","ln x over ln a","new log divided by new log of the base","divide log of the number by log of the base"],
       hint:"e.g. “log x over log a”"},
      {sec:"rules", q:"One-to-One Property (solving log equations)",
       a:"If logₐ(M) = logₐ(N), then M = N.\nSame base on both sides → just set the insides equal.",
       accept:["set the insides equal","m equals n","drop the logs and set them equal"]},

      /* --- APPLY --- */
      {sec:"apply", noTest:true, q:"Expand: log(x²y / z)",
       a:"2·log(x) + log(y) − log(z)\nPower rule first, then product (+) and quotient (−).",
       accept:["2 log x plus log y minus log z"]},
      {sec:"apply", noTest:true, q:"Expand: log₃(5x⁴)",
       a:"log₃(5) + 4·log₃(x)\nProduct rule splits the 5 and the x⁴, then power rule drops the 4.",
       accept:["log3 5 plus 4 log3 x","log of 5 plus 4 log x"]},
      {sec:"apply", noTest:true, q:"Condense: 3·log(x) + log(y)",
       a:"log(x³y)\nThe 3 goes back up as an exponent, then + becomes multiplication.",
       accept:["log of x cubed times y","log x^3 y"]},
      {sec:"apply", noTest:true, q:"Condense: 2·log(x) − log(y)",
       a:"log(x² / y)\nThe 2 goes back up as an exponent, then − becomes division.",
       accept:["log of x squared over y","log x^2 / y"]},
      {sec:"apply", q:"Order of operations when EXPANDING a log",
       a:"1. Power rule (bring exponents down)\n2. Quotient rule (division → subtraction)\n3. Product rule (multiplication → addition)",
       accept:["power first then quotient then product","powers down first then split it up"]},
      {sec:"apply", q:"Order of operations when CONDENSING logs",
       a:"1. Power rule in reverse (coefficients go back up as exponents)\n2. Then combine: + becomes multiply, − becomes divide",
       accept:["coefficients go up as exponents first then combine","reverse the power rule then combine"]},
      {sec:"apply", q:"How do you solve  log₂(x) = 5 ?",
       a:"Rewrite it in exponential form: 2⁵ = x, so x = 32.",
       accept:["rewrite as an exponential","2 to the 5th equals x","x = 32","put it in exponential form"]},
      {sec:"apply", q:"How do you solve  3ˣ = 20 ?",
       a:"Take the log of BOTH sides, then use the power rule to bring the x down.\nx·log(3) = log(20)   so   x = log(20)/log(3)",
       accept:["take the log of both sides","log both sides then divide","use change of base"]}
     ]}
  ]},

/* ================== BIOLOGY & BIOMEDICAL ================== */
{key:"bio", label:"Biology & Biomedical", icon:"\u{1F9EC}", color:"#22c55e", courses:[

  {key:"biohonors", label:"Biology Honors", units:[
    {key:"photoresp", label:"Photosynthesis & Cellular Respiration",
     sections:[
       {key:"big",   label:"Big Picture"},
       {key:"photo", label:"Photosynthesis"},
       {key:"resp",  label:"Cellular Respiration"},
       {key:"ferm",  label:"Fermentation"},
       {key:"btb",   label:"BTB Lab"},
       {key:"cer",   label:"CER Write-Up"},
       {key:"traps", label:"Test Traps"}
     ],
     cards:[
      /* --- BIG PICTURE --- */
      {sec:"big", q:"What do photosynthesis and cellular respiration each DO?",
       a:"Photosynthesis STORES energy — it turns light energy into glucose.\nCellular respiration RELEASES energy — it breaks glucose down into ATP the cell can use.",
       accept:["photosynthesis stores energy respiration releases it","one makes glucose the other breaks it down"]},
      {sec:"big", q:"Which organisms do PHOTOSYNTHESIS?",
       a:"Autotrophs / producers — plants, algae, and some bacteria. Anything with chloroplasts.",
       accept:["autotrophs","producers","autotrophs or producers","plants and algae","things with chloroplasts"]},
      {sec:"big", star:true, q:"Which organisms do CELLULAR RESPIRATION?",
       a:"Almost ALL living things — plants AND animals, fungi, bacteria.\nPlants do BOTH. This is the #1 thing people get wrong.",
       accept:["all of them","both plants and animals","almost every living thing","everything including plants"]},
      {sec:"big", star:true, q:"How are the two equations related?",
       a:"They are opposites. The products of one are the reactants of the other.\nPhotosynthesis makes glucose + O₂ → respiration uses glucose + O₂.\nRespiration makes CO₂ + H₂O → photosynthesis uses CO₂ + H₂O.",
       accept:["they are opposites","the products of one are the reactants of the other","they reverse each other"]},
      {sec:"big", q:"Gas exchange: who takes in what?",
       a:"Photosynthesis: takes IN CO₂, gives OFF O₂\nRespiration: takes IN O₂, gives OFF CO₂",
       accept:["photosynthesis takes in co2 and releases o2 respiration is the opposite"]},

      /* --- PHOTOSYNTHESIS --- */
      {sec:"photo", star:true, q:"Write the PHOTOSYNTHESIS equation",
       a:"6CO₂ + 6H₂O + Light Energy → C₆H₁₂O₆ + 6O₂",
       accept:["6co2 + 6h2o + light energy -> c6h12o6 + 6o2","six carbon dioxide plus six water plus light makes glucose plus six oxygen"],
       hint:"Type it like: 6CO2 + 6H2O + light -> C6H12O6 + 6O2"},
      {sec:"photo", star:true, q:"Photosynthesis REACTANTS (what goes in)",
       a:"Carbon dioxide (6CO₂), water (6H₂O), and light energy",
       accept:["co2 water and light","carbon dioxide water light energy"]},
      {sec:"photo", star:true, q:"Photosynthesis PRODUCTS (what comes out)",
       a:"Glucose (C₆H₁₂O₆) and oxygen (6O₂)",
       accept:["glucose and oxygen","sugar and o2"]},
      {sec:"photo", q:"Where does photosynthesis happen?",
       a:"In the CHLOROPLAST.\nLight reactions → thylakoid membrane\nCalvin cycle → stroma",
       accept:["the chloroplast","in chloroplasts"]},
      {sec:"photo", q:"What does chlorophyll do?",
       a:"It is the green pigment inside chloroplasts that ABSORBS light energy (mostly red and blue) so the plant can use it.\nIt reflects green, which is why plants look green.",
       accept:["absorbs light energy","it captures the light","green pigment that traps light"]},
      {sec:"photo", q:"Light-DEPENDENT reactions — where and what do they make?",
       a:"Thylakoid membrane.\nThey split water, release O₂ as waste, and make ATP + NADPH to power the next stage.",
       accept:["thylakoid membrane","they split water and make atp and nadph"]},

/* =====================================================================
   ANSWER MATCHING
   ===================================================================== */
var SUBMAP = {"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5",
"₆":"6","₇":"7","₈":"8","₉":"9","⁰":"0","¹":"1","²":"2",
"³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9",
"ᵖ":"p","ˣ":"x","ʸ":"y","ₐ":"a","₁₂":"12"};

var STOP = {a:1,an:1,the:1,of:1,or:1,and:1,to:1,in:1,on:1,is:1,are:1,for:1,by:1,with:1,
that:1,this:1,it:1,as:1,at:1,from:1,be:1,its:1,you:1,your:1,was:1,were:1,into:1,than:1,
then:1,so:1,but:1,they:1,their:1,there:1,when:1,which:1,what:1,does:1,did:1,has:1,have:1,
had:1,will:1,can:1,if:1,about:1,just:1,also:1,any:1,some:1,while:1,because:1};

function deSub(s){
  var out = "";
  for(var i=0;i<s.length;i++){ var ch = s[i]; out += (SUBMAP[ch] !== undefined ? SUBMAP[ch] : ch); }
  return out;
}
function norm(s){
  return deSub(String(s == null ? "" : s))
    .toLowerCase()
    .replace(/[^a-z0-9]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function toks(s){
  var raw  = norm(s).split(" ").filter(function(w){ return w.length > 0; });
  var keep = raw.filter(function(w){ return w.length >= 2 || /^[0-9]$/.test(w); });
  var ns   = keep.filter(function(w){ return !STOP[w]; });
  return ns.length ? ns : keep;
}
function lev(a,b){
  var m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  var prev = [], cur = [], i, j;
  for(j=0;j<=n;j++) prev[j] = j;
  for(i=1;i<=m;i++){
    cur[0] = i;
    for(j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    }
    for(j=0;j<=n;j++) prev[j] = cur[j];
  }
  return prev[n];
}
/* strip a plural s so "cells" == "cell", "eyes" == "eye" */
function stem(w){
  if(w.length > 3 && w.charAt(w.length-1) === "s" && w.slice(-2) !== "ss") return w.slice(0,-1);
  return w;
}
/* word-level match.
   Deliberately STRICT: a false positive silently teaches the wrong answer,
   a false negative is one tap on "I was actually right".
     - exact, or same word once a plural s is stripped
     - one word is a truncation of the other, but only for long words
       (so "again" never matches "against", "quad" never matches "quadrant")
     - a small typo, but the first letter must agree
       (so "excision" never matches "incision")                          */
function wm(a,b){
  if(a === b) return true;
  if(stem(a) === stem(b)) return true;
  var mn = Math.min(a.length, b.length);
  if(mn >= 6 && (a.indexOf(b) === 0 || b.indexOf(a) === 0)) return true;
  if(mn >= 5 && a.charAt(0) === b.charAt(0)) return lev(a,b) <= (mn >= 9 ? 2 : 1);
  return false;
}
/* how many distinct meaningful tokens a string carries */
function richness(s){
  var seen = {}, n = 0;
  toks(s).forEach(function(t){ if(!seen[t]){ seen[t] = 1; n++; } });
  return n;
}

/* build every phrasing that should count as correct */
function buildAlts(ans){
  var set = {}, order = [];
  function push(s){
    if(s == null) return;
    s = String(s).trim();
    if(!s) return;
    if(!set[s]){ set[s] = 1; order.push(s); }
  }
  var full  = String(ans == null ? "" : ans);
  var lines = full.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);

  /* A formula line such as "log(MN) = log(M) + log(N)" or "2log(x) + log(y)"
     survives normalisation as almost nothing (single letters get dropped), so
     it would happily match any OTHER formula. Line-level phrasings therefore
     have to carry at least two real words to be used for matching.
     Answers that are genuinely one word ("Every", "All", "Dry") are exempt,
     and every card like that has an accept list as a backstop.              */
  var fullRich = richness(full);
  function usable(l){
    if(fullRich < 2) return true;
    if(l.indexOf("=") > -1 && richness(l) < 3) return false;
    return richness(l) >= 2;
  }
  var prose = lines.filter(usable);
  var joined = prose.join(" ");
  if(usable(joined)) push(joined);
  prose.forEach(push);
  if(!order.length) push(full.replace(/\n/g," "));

  /* Parentheticals count on their own, and the sentence without them counts too.
     A purely numeric parenthetical is skipped — "log(1) = 0" must not hand out
     a standalone alternative of "1".                                          */
  order.slice().forEach(function(t){
    var found = t.match(/\(([^)]*)\)/g);
    if(found){
      found.forEach(function(m){
        var inner = m.slice(1,-1);
        if(toks(inner).some(function(w){ return /[a-z]/.test(w); })) push(inner);
      });
      /* the de-parenthesised sentence, but only if real words survive it —
         "log(20)/log(3)" must not collapse into a bare "log" alternative   */
      var bare = t.replace(/\([^)]*\)/g," ");
      if(toks(bare).some(function(w){ return /^[a-z]{4,}$/.test(w); })) push(bare);
    }
  });
  /* " / " always separates full alternates */
  order.slice().forEach(function(t){
    if(t.indexOf(" / ") > -1) t.split(" / ").forEach(push);
  });
  /* Commas and " or " split list-style answers ("Without, not, lack of").
     Gate on the WHOLE answer, not the line: comma-splitting a long explanation
     leaves scraps like "which turns it yellow" that match almost anything.  */
  if(fullRich <= 8){
    order.slice().forEach(function(t){
      if(t.indexOf(",") > -1) t.split(",").forEach(push);
      if(/ or /i.test(t))     t.split(/ or /i).forEach(push);
    });
  }
  return order;
}

/* COVERAGE: did the student say everything this phrasing needs?
   PRECISION: is what they typed actually drawn from this card's answer?
   Precision is measured against the WHOLE answer (every phrasing plus the
   accept list), not the one phrasing being tested, so writing two correct
   synonyms is never punished — but "every 2 hours" still fails on "qh",
   because the 2 appears nowhere in that card.                             */
function coverage(A, U){
  if(!A.length) return 0;
  var n = 0;
  A.forEach(function(a){ if(U.some(function(u){ return wm(a,u); })) n++; });
  return n / A.length;
}
function passes(alt, U, precision){
  var A = toks(alt);
  if(!A.length || !U.length) return false;
  var needCov = A.length <= 8 ? 0.8 : 0.6;
  var needPre = A.length <= 3 ? 0.7 : 0.4;
  return coverage(A, U) >= needCov && precision >= needPre;
}
function grade(card, userText){
  if(!userText || !userText.trim()) return false;
  var U = toks(userText);
  if(!U.length) return false;

  var cands = buildAlts(card.a).concat(card.accept || []);
  var seen = {}, universe = [];
  cands.forEach(function(c){
    toks(c).forEach(function(t){ if(!seen[t]){ seen[t] = 1; universe.push(t); } });
  });
  var hit = 0;
  U.forEach(function(u){ if(universe.some(function(a){ return wm(a,u); })) hit++; });
  var precision = hit / U.length;

  for(var i=0;i<cands.length;i++){ if(passes(cands[i], U, precision)) return true; }
  return false;
}

  $("s-title").textContent = curC.label;
  $("s-sub").textContent   = curU.label;
  $("m-flash").classList.add("on");
  $("m-test").classList.remove("on");
  $("flashStage").style.display = "";
  $("testStage").style.display  = "none";
  showScreen("study");
  rebuild();
}
function goHome(){ buildHome(); showScreen("home"); }
function exitStudy(){
  if(curC && curC.units.length > 1){ openCourse(curG.key, curC.key); }
  else { goHome(); }
}

/* =====================================================================
   TABS / FILTERS / DECK
   ===================================================================== */
function sectionOf(k){
  var f = curU.sections.filter(function(s){ return s.key === k; });
  return f.length ? f[0] : null;
}
function countSec(k){
  return curU.cards.filter(function(c){ return k === "all" || c.sec === k; }).length;
}
function countSub(k){
  return curU.cards.filter(function(c){
    return c.sec === secKey && (k === "all" || c.sub === k);
  }).length;
}
function renderTabs(){
  var multi = curU.sections.length > 1;
  var list  = (multi ? [{key:"all", label:"All"}] : []).concat(curU.sections);
  $("tabs").innerHTML = list.map(function(s){
    return '<button class="tab' + (secKey === s.key ? " on" : "") + '" onclick="pickSec(\'' + s.key + '\')">'
         + esc(s.label) + '<span class="n">' + countSec(s.key) + '</span></button>';
  }).join("");

  var sec = sectionOf(secKey);
  var st  = $("subtabs");
  if(sec && sec.subs && sec.subs.length){
    var subs = [{key:"all", label:"All " + sec.label.replace(/^[\d.]+\s*/,"")}].concat(sec.subs);
    st.style.display = "";
    st.innerHTML = subs.map(function(s){
      return '<button class="tab sub' + (subKey === s.key ? " on" : "") + '" onclick="pickSub(\'' + s.key + '\')">'
           + esc(s.label) + '<span class="n">' + countSub(s.key) + '</span></button>';
    }).join("");
  } else {
    st.style.display = "none";
    st.innerHTML = "";
  }
  centerActive("tabs"); centerActive("subtabs");
}
/* the rows scroll sideways on a phone — keep the selected chip in view */
function centerActive(rowId){
  var row = $(rowId); if(!row) return;
  var on = row.querySelector(".tab.on, .chip.on"); if(!on) return;
  row.scrollLeft = Math.max(0, on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2);
}
function scopeCards(){
  return curU.cards.filter(function(c){
    if(secKey !== "all" && c.sec !== secKey) return false;
    var sec = sectionOf(secKey);
    if(sec && sec.subs && subKey !== "all" && c.sub !== subKey) return false;
    return true;
  });
}
function renderFilters(){
  var base = scopeCards();
  var n = {
    all:   base.length,
    star:  base.filter(isStar).length,
    learn: base.filter(function(c){ return statOf(c) === "learning"; }).length,
    known: base.filter(function(c){ return statOf(c) === "known"; }).length
  };
  var defs = [
    {k:"all",   t:"All"},
    {k:"star",  t:"⭐ Starred"},
    {k:"learn", t:"\u{1F4D5} Still learning"},
    {k:"known", t:"✅ Known"}
  ];
  $("filters").innerHTML = '<span class="lbl">Show:</span>' + defs.map(function(d){
    var dis = (d.k !== "all" && !n[d.k]) ? " disabled" : "";
    return '<button class="chip' + (filter === d.k ? " on" : "") + '"' + dis
         + ' onclick="pickFilter(\'' + d.k + '\')">' + d.t + ' ' + n[d.k] + '</button>';
  }).join("");
  centerActive("filters");
}
function pickSec(k){ secKey = k; subKey = "all"; rebuild(); }
function pickSub(k){ subKey = k; rebuild(); }
function pickFilter(k){ filter = k; rebuild(); }

function rebuild(){
  var list = scopeCards();
  if(filter === "star")       list = list.filter(isStar);
  else if(filter === "learn") list = list.filter(function(c){ return statOf(c) === "learning"; });
  else if(filter === "known") list = list.filter(function(c){ return statOf(c) === "known"; });
  deck = list; idx = 0; flipped = false;
  renderTabs(); renderFilters();
  if(mode === "flash") renderFlash(); else startTest();
}

/* =====================================================================
   FLASHCARD MODE
   ===================================================================== */
function sizeFlipper(){
  var fl = $("flipper"); if(!fl) return;
  var f = fl.querySelector(".face.is-front"), b = fl.querySelector(".face.is-back");
  if(!f || !b) return;
  fl.style.height = Math.max(f.offsetHeight, b.offsetHeight, 230) + "px";
}
function renderFlash(){
  var st = $("flashStage");
  if(!deck.length){
    st.innerHTML = '<div class="empty">No cards here yet.<br>Try a different tab or filter.</div>';
    $("kbdhint").innerHTML = "";
    return;
  }
  if(idx >= deck.length) idx = deck.length - 1;
  var c = deck[idx];
  var known = deck.filter(function(k){ return statOf(k) === "known"; }).length;
  var learn = deck.filter(function(k){ return statOf(k) === "learning"; }).length;
  var s = statOf(c);

  var tags = "";
  if(c.tip)      tags += '<span class="tag tip">Memory trick</span>';
  if(isStar(c))  tags += '<span class="tag star">⭐ High priority</span>';
  if(s === "known")    tags += '<span class="tag known">✅ Known</span>';
  if(s === "learning") tags += '<span class="tag learn">\u{1F4D5} Still learning</span>';

  st.innerHTML =
      '<div class="bar"><i style="width:' + ((idx+1)/deck.length*100) + '%"></i></div>'
    + '<div class="meta"><span>Card ' + (idx+1) + ' of ' + deck.length + '</span>'
    + '<span class="rt"><span class="ok">✅ ' + known + '</span>'
    + '<span class="lr">\u{1F4D5} ' + learn + '</span></span></div>'
    + '<div class="flipbox" onclick="flip()">'
    +   '<div class="flipper' + (flipped ? " flipped" : "") + '" id="flipper">'
    +     '<div class="face is-front"><div class="q">' + nl(c.q) + '</div>'
    +       (tags ? '<div class="tagline">' + tags + '</div>' : "")
    +       '<div class="tiny">tap to flip</div></div>'
    +     '<div class="face is-back"><div class="a">' + nl(c.a) + '</div>'
    +       '<div class="tiny">tap to flip back</div></div>'
    +   '</div></div>'
    + '<div class="row">'
    +   '<button class="b lrn" onclick="mark(event,\'learning\')">\u{1F4D5} Still learning</button>'
    +   '<button class="b ok" onclick="mark(event,\'known\')">✅ I know it</button>'
    + '</div>'
    + '<div class="row">'
    +   '<button class="b nav" onclick="prevCard(event)"' + (idx === 0 ? " disabled" : "") + '>&larr; Prev</button>'
    +   '<button class="icobtn" title="Star this card" onclick="starCard(event)">' + (isStar(c) ? "⭐" : "☆") + '</button>'
    +   '<button class="icobtn" title="Shuffle" onclick="doShuffle(event)">\u{1F500}</button>'
    +   '<button class="b primary" onclick="nextCard(event)"' + (idx === deck.length-1 ? " disabled" : "") + '>Next &rarr;</button>'
    + '</div>'
    + '<div class="row"><button class="b quiet" onclick="clearProgress(event)">Reset this deck’s progress</button></div>';

  $("kbdhint").innerHTML = '<span>space</span> flip &nbsp; <span>&larr;</span> <span>&rarr;</span> move &nbsp; <span>K</span> know it &nbsp; <span>L</span> still learning';
  sizeFlipper();
}
function flip(){
  if(!deck.length) return;
  flipped = !flipped;
  var fl = $("flipper");
  if(fl) fl.classList.toggle("flipped", flipped);
}
function nextCard(e){ if(e) e.stopPropagation(); if(idx < deck.length-1){ idx++; flipped = false; renderFlash(); } }
function prevCard(e){ if(e) e.stopPropagation(); if(idx > 0){ idx--; flipped = false; renderFlash(); } }
function doShuffle(e){ if(e) e.stopPropagation(); shuffleArr(deck); idx = 0; flipped = false; renderFlash(); toast("Shuffled"); }
function starCard(e){
  if(e) e.stopPropagation();
  var c = deck[idx];
  store.star[c.id] = !isStar(c);
  saveStore(); renderFilters(); renderFlash();
}
function mark(e, how){
  if(e) e.stopPropagation();
  var c = deck[idx];
  if(statOf(c) === how) delete store.stat[c.id]; else store.stat[c.id] = how;
  saveStore();
  if(idx < deck.length-1){ idx++; flipped = false; }
  renderFilters(); renderFlash();
}
function clearProgress(e){
  if(e) e.stopPropagation();
  if(!confirm("Clear known / still-learning marks for this whole unit?")) return;
  curU.cards.forEach(function(c){ delete store.stat[c.id]; });
  saveStore(); rebuild(); toast("Progress cleared");
}

/* =====================================================================
   TEST MODE
   ===================================================================== */
function setMode(m){
  mode = m;
  $("m-flash").classList.toggle("on", m === "flash");
  $("m-test").classList.toggle("on",  m === "test");
  $("flashStage").style.display = m === "flash" ? "" : "none";
  $("testStage").style.display  = m === "test"  ? "" : "none";
  if(m === "flash"){ renderFlash(); } else { startTest(); }
}
function startTest(){
  /* Memory tricks are mnemonics, not questions. noTest cards are ones whose
     answer is an algebra expression — you cannot fairly type those, and a
     loose match there would mark a wrong formula correct. Both stay in Cards. */
  tq = shuffleArr(deck.filter(function(c){ return !c.tip && !c.noTest; }));
  ti = 0; tScore = 0; tMissed = []; tAnswered = false; tFinished = false;
  renderTest();
}
function retryMissed(){
  if(!tMissed.length) return;
  tq = shuffleArr(tMissed.slice());
  ti = 0; tScore = 0; tMissed = []; tAnswered = false; tFinished = false;
  renderTest();
}
function renderTest(){
  var st = $("testStage");
  if(!tq.length){
    st.innerHTML = '<div class="empty">Nothing to type-test here.<br>'
      + (deck.length ? "These cards are memory tricks or algebra — study them in Cards mode."
                     : "Pick another tab or filter.")
      + '</div>';
    $("kbdhint").innerHTML = "";
    return;
  }
  if(tFinished || ti >= tq.length){ renderScore(); return; }
  var c = tq[ti];
  st.innerHTML =
      '<div class="bar"><i style="width:' + (ti/tq.length*100) + '%"></i></div>'
    + '<div class="meta"><span>Question ' + (ti+1) + ' of ' + tq.length
    +   (deck.length > tq.length ? ' <span style="color:var(--dim)">· '
        + (deck.length - tq.length) + ' skipped</span>' : "") + '</span>'
    + '<span class="rt"><span class="ok">Score ' + tScore + '</span></span></div>'
    + '<div class="qbox">' + nl(c.q) + '</div>'
    + '<div class="qhint">' + (c.hint ? esc(c.hint) : "Type what it means — close enough counts") + '</div>'
    + '<input class="inp" id="tinp" autocomplete="off" autocorrect="off" autocapitalize="off" '
    +   'spellcheck="false" placeholder="Your answer…">'
    + '<div id="tres"></div>'
    + '<div class="row" style="margin-top:12px" id="trow">'
    +   '<button class="b quiet" onclick="revealAnswer()">I don’t know</button>'
    +   '<button class="b primary" onclick="checkAnswer()">Check answer</button>'
    + '</div>';
  var inp = $("tinp");
  inp.addEventListener("keydown", function(ev){
    if(ev.key === "Enter"){ ev.preventDefault(); if(tAnswered) testNext(); else checkAnswer(); }
  });
  tAnswered = false;
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 40);
  $("kbdhint").innerHTML = '<span>enter</span> check, then <span>enter</span> again for the next one';
}
function showResult(c, userText, correct, skipped){
  tAnswered = true;
  if(correct){ tScore++; if(statOf(c) !== "known"){ store.stat[c.id] = "known"; saveStore(); } }
  else { tMissed.push(c); store.stat[c.id] = "learning"; saveStore(); }

  $("tres").innerHTML =
      '<div class="res ' + (correct ? "good" : "bad") + '">'
    +   '<div class="hd">' + (correct ? "✅ Correct" : (skipped ? "\u{1F4D5} No worries — here it is" : "❌ Not quite")) + '</div>'
    +   (userText && !skipped ? '<div class="yours">You wrote: “' + esc(userText) + '”</div>' : "")
    +   '<div class="ans"><b>Answer</b>' + nl(c.a) + '</div>'
    + '</div>';

  var row = '<button class="b nav" onclick="testNext()">' + (ti === tq.length-1 ? "See results" : "Next question →") + '</button>';
  if(!correct) row = '<button class="b ok" onclick="overrideRight()">I was actually right</button>' + row;
  $("trow").innerHTML = row;

  var inp = $("tinp");
  if(inp) inp.disabled = true;
}
function checkAnswer(){
  if(tAnswered) return;
  var inp = $("tinp"); if(!inp) return;
  var v = inp.value.trim();
  if(!v){ inp.focus(); return; }
  var c = tq[ti];
  showResult(c, v, grade(c, v), false);
}
function revealAnswer(){
  if(tAnswered) return;
  var inp = $("tinp");
  showResult(tq[ti], inp ? inp.value.trim() : "", false, true);
}
function overrideRight(){
  var c = tq[ti];
  tScore++;
  tMissed = tMissed.filter(function(x){ return x.id !== c.id; });
  store.stat[c.id] = "known"; saveStore();
  $("tres").innerHTML =
      '<div class="res good"><div class="hd">✅ Counted as correct</div>'
    + '<div class="ans"><b>Answer</b>' + nl(c.a) + '</div></div>';
  $("trow").innerHTML = '<button class="b nav" onclick="testNext()">'
    + (ti === tq.length-1 ? "See results" : "Next question →") + '</button>';
}
function testNext(){
  ti++;
  if(ti >= tq.length){ tFinished = true; renderScore(); }
  else renderTest();
}
function renderScore(){
  var pct = tq.length ? Math.round(tScore / tq.length * 100) : 0;
  var col = pct >= 80 ? "var(--green)" : pct >= 60 ? "var(--amber)" : "var(--red)";
  var msg = pct >= 90 ? "You've got this one down."
          : pct >= 80 ? "Solid. Clean up the misses and you're set."
          : pct >= 60 ? "Halfway there — run the missed ones again."
          : "Go back to the cards for this section first, then retest.";
  var missedHtml = "";
  if(tMissed.length){
    missedHtml = '<div class="missed"><h4>Missed — ' + tMissed.length + ' card'
      + (tMissed.length > 1 ? "s" : "") + '</h4><ul>'
      + tMissed.map(function(c){
          return '<li><div class="mq">' + esc(c.q) + '</div><div class="ma">' + nl(c.a) + '</div></li>';
        }).join("")
      + '</ul></div>';
  }
  $("testStage").innerHTML =
      '<div class="score">'
    +   '<div class="big" style="color:' + col + '">' + tScore + '/' + tq.length + '</div>'
    +   '<div class="pct">' + pct + '%</div>'
    +   '<div class="msg">' + msg + '</div>'
    +   missedHtml
    +   '<div class="row">'
    +     (tMissed.length ? '<button class="b lrn" onclick="retryMissed()">Retry the ' + tMissed.length + ' I missed</button>' : "")
    +     '<button class="b primary" onclick="startTest()">Restart full test</button>'
    +     '<button class="b nav" onclick="setMode(\'flash\')">Back to cards</button>'
    +   '</div>'
    + '</div>';
  $("kbdhint").innerHTML = "";
}

/* =====================================================================
   ANKI EXPORT
   ===================================================================== */
function exportAnki(){
  if(!curU){ return; }
  var src = deck.length ? deck : scopeCards();
  if(!src.length){ toast("Nothing to export here"); return; }
  var lines = ["#separator:tab", "#html:true", "#notetype:Basic"];
  src.forEach(function(c){
    var q = String(c.q).replace(/\t/g," ").replace(/\n/g,"<br>");
    var a = String(c.a).replace(/\t/g," ").replace(/\n/g,"<br>");
    lines.push(q + "\t" + a);
  });
  var name = (curC.label + " " + curU.label + " " + (secKey === "all" ? "" : secKey)
             + (subKey === "all" ? "" : " " + subKey))
             .replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_|_$/g,"");
  var blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href = url; a.download = name + ".txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast("Exported " + src.length + " cards for Anki");
}

/* =====================================================================
   KEYBOARD
   ===================================================================== */
document.addEventListener("keydown", function(e){
  if(!$("study").classList.contains("on")) return;
  var tag = (e.target && e.target.tagName) || "";
  if(tag === "INPUT" || tag === "TEXTAREA") return;
  if(mode !== "flash" || !deck.length) return;
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); nextCard(); }
  else if(e.key === "ArrowLeft"){  e.preventDefault(); prevCard(); }
  else if(e.key === "k" || e.key === "K"){ mark(null, "known"); }
  else if(e.key === "l" || e.key === "L"){ mark(null, "learning"); }
  else if(e.key === "s" || e.key === "S"){ starCard(null); }
});
window.addEventListener("resize", function(){ if(mode === "flash") sizeFlipper(); });

/* =====================================================================
   GO
   ===================================================================== */
loadStore();
buildHome();
</script>
