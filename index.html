<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varish — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090F;--s1:#0D1117;--s2:#161C27;--s3:#1E2535;
  --text:#E8EDF5;--sub:#5A6A82;--muted:#3A4557;
  --border:#1A2236;--radius:12px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* ── HOME ── */
#home{display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.home-title{font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}
.home-h{font-size:28px;font-weight:700;margin-bottom:32px;letter-spacing:-.01em}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:100%;max-width:720px}
.subject-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.subject-card:hover{transform:translateY(-2px)}
.subject-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.subject-icon{font-size:26px;margin-bottom:10px}
.subject-name{font-size:15px;font-weight:600;margin-bottom:4px}
.subject-unit{font-size:11px;color:var(--sub);line-height:1.4;margin-bottom:6px}
.subject-meta{font-size:12px;color:var(--muted)}
.empty-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;background:var(--s3);color:var(--muted);margin-top:6px;border:1px solid var(--border)}

/* ── STUDY VIEW ── */
#study{display:none;flex-direction:column;align-items:center;padding:20px 16px;min-height:100vh}
.back-btn{align-self:flex-start;background:transparent;border:1px solid var(--border);color:var(--sub);padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:20px;transition:all .15s}
.back-btn:hover{border-color:var(--sub);color:var(--text)}
.study-header{width:100%;max-width:680px;margin-bottom:16px}
.study-subject{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.study-unit-line{font-size:13px;color:var(--text);margin:2px 0 3px;font-weight:500}
.study-count{font-size:12px;color:var(--sub)}
.prog-bar{width:100%;max-width:680px;height:3px;background:var(--border);border-radius:2px;margin-bottom:18px}
.prog-fill{height:100%;border-radius:2px;transition:width .3s}
.tabs{display:flex;flex-wrap:wrap;gap:5px;max-width:680px;width:100%;margin-bottom:20px}
.tab{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab.active{color:#fff;border-color:transparent}
.card-wrap{perspective:1200px;width:100%;max-width:680px;height:270px;cursor:pointer;margin-bottom:20px}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.card-inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 32px;text-align:center}
.face-front{background:var(--s2);border:1px solid var(--border)}
.face-back{transform:rotateY(180deg);border:1px solid}
.face-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.4;margin-bottom:14px}
.face-text{font-size:19px;font-weight:500;line-height:1.5;white-space:pre-line}
.face-text.sm{font-size:15px}
.corner-tag{position:absolute;top:14px;left:18px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;opacity:.35}
.star-pip{position:absolute;top:13px;right:16px;font-size:16px;opacity:.85}
.face-hint{position:absolute;bottom:13px;font-size:11px;color:var(--sub);opacity:.5}
.controls{display:flex;align-items:center;gap:14px;width:100%;max-width:680px;justify-content:center;margin-bottom:12px}
.nav-btn{padding:9px 22px;border-radius:9px;border:1px solid var(--border);background:var(--s2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;min-width:86px}
.nav-btn:hover:not(:disabled){border-color:var(--sub)}
.nav-btn:disabled{opacity:.2;cursor:default}
.count-lbl{font-size:13px;color:var(--sub);min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;margin-bottom:10px;justify-content:center}
.sm-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:12px;cursor:pointer;transition:all .15s}
.sm-btn:hover{color:var(--text);border-color:var(--sub)}
.kb-hint{font-size:11px;color:var(--muted);text-align:center}
.kb-hint code{background:var(--s2);padding:1px 5px;border-radius:4px;color:var(--sub);font-size:10px}
.empty-state{color:var(--sub);font-size:14px;padding:40px;text-align:center;line-height:1.8}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="home-title">Varish Nuthi</div>
  <div class="home-h">Flashcards</div>
  <div class="subject-grid" id="subject-grid"></div>
</div>

<!-- STUDY VIEW -->
<div id="study">
  <button class="back-btn" onclick="goHome()">← All subjects</button>
  <div class="study-header">
    <div class="study-subject" id="study-subject-name"></div>
    <div class="study-unit-line" id="study-unit"></div>
    <div class="study-count" id="study-count"></div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog"></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="card-wrap" onclick="flip()" id="card-wrap">
    <div class="card-inner" id="card-inner">
      <div class="face face-front" id="front-face">
        <span class="corner-tag" id="sec-tag"></span>
        <span class="star-pip" id="star-pip"></span>
        <div class="face-label">Question</div>
        <div class="face-text" id="q-text"></div>
        <span class="face-hint">tap to flip</span>
      </div>
      <div class="face face-back" id="back-face">
        <div class="face-label">Answer</div>
        <div class="face-text" id="a-text"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="nav-btn" id="prev-btn" onclick="prev()">← Prev</button>
    <span class="count-lbl" id="count-lbl"></span>
    <button class="nav-btn" id="next-btn" onclick="next()">Next →</button>
  </div>
  <div class="row">
    <button class="sm-btn" onclick="shuffleDeck()">⇄ Shuffle</button>
    <button class="sm-btn" onclick="resetDeck()">↺ Restart</button>
  </div>
  <div class="kb-hint"><code>Space</code> flip &nbsp;·&nbsp; <code>←</code><code>→</code> navigate</div>
</div>

// ── ENGINE ─────────────────────────────────────────────────────
let curSubjectKey = null, deck = [], idx = 0, flipped = false, activeSec = "all";

function goHome() {
  document.getElementById('home').style.display = 'flex';
  document.getElementById('study').style.display = 'none';
  curSubjectKey = null;
}

function openSubject(key) {
  const sub = SUBJECTS[key];
  if (!sub.cards.length) return;
  curSubjectKey = key;
  document.getElementById('home').style.display = 'none';
  document.getElementById('study').style.display = 'flex';
  document.getElementById('study-subject-name').textContent = sub.label;
  document.getElementById('study-subject-name').style.color = sub.color;
  document.getElementById('study-unit').textContent = sub.unit || '';
  document.getElementById('prog').style.background = sub.color;
  activeSec = 'all';
  buildTabs();
  buildDeck('all');
}

function buildTabs() {
  const sub = SUBJECTS[curSubjectKey];
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  const addTab = (id, label, isStar) => {
    const count = id === 'all'
      ? sub.cards.length
      : sub.cards.filter(c => c.sec === id).length;
    if (id !== 'all' && count === 0) return;
    const btn = document.createElement('button');
    btn.className = 'tab' + (id === activeSec ? ' active' : '');
    if (id === activeSec) { btn.style.background = sub.color + '30'; btn.style.borderColor = sub.color; btn.style.color = sub.color; }
    btn.textContent = label + ' (' + count + ')';
    btn.onclick = () => {
      activeSec = id;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
        t.style.background=''; t.style.borderColor=''; t.style.color='';
      });
      btn.classList.add('active');
      btn.style.background = sub.color + '30';
      btn.style.borderColor = sub.color;
      btn.style.color = sub.color;
      buildDeck(id);
    };
    wrap.appendChild(btn);
  };
  addTab('all','All');
  const secKeys = sub.sections && Object.keys(sub.sections).length
    ? Object.keys(sub.sections)
    : [...new Set(sub.cards.map(c=>c.sec))];
  secKeys.forEach(k => addTab(k, sub.sections[k] || k));
}

function buildDeck(sec) {
  const sub = SUBJECTS[curSubjectKey];
  deck = sec === 'all' ? [...sub.cards] : sub.cards.filter(c => c.sec === sec);
  idx = 0; flipped = false; renderCard();
}

function renderCard() {
  const sub = SUBJECTS[curSubjectKey];
  if (!deck.length) {
    document.getElementById('q-text').textContent = 'No cards in this section yet.';
    document.getElementById('a-text').textContent = '';
    document.getElementById('count-lbl').textContent = '0 / 0';
    return;
  }
  const c = deck[idx];
  const isStar = !!c.star;
  const qt = document.getElementById('q-text');
  qt.textContent = c.q;
  qt.className = 'face-text' + (c.q.length > 80 ? ' sm' : '');
  const at = document.getElementById('a-text');
  at.textContent = c.a;
  at.className = 'face-text' + (c.a.length > 80 ? ' sm' : '');
  document.getElementById('sec-tag').textContent = (sub.sections[c.sec] || c.sec).replace(/⭐\s*/,'');
  document.getElementById('star-pip').textContent = isStar ? '★' : '';
  document.getElementById('star-pip').style.color = isStar ? '#F59E0B' : '';
  const front = document.getElementById('front-face');
  const back  = document.getElementById('back-face');
  front.style.borderColor = isStar ? '#F59E0B' : 'var(--border)';
  back.style.background = sub.color + '18';
  back.style.borderColor = sub.color;
  document.getElementById('card-inner').classList.remove('flipped');
  flipped = false;
  const pct = deck.length > 1 ? (idx / (deck.length - 1)) * 100 : 0;
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('count-lbl').textContent = (idx+1) + ' / ' + deck.length;
  document.getElementById('study-count').textContent = deck.length + ' cards';
  document.getElementById('prev-btn').disabled = idx === 0;
  document.getElementById('next-btn').disabled = idx === deck.length - 1;
}

function flip() {
  flipped = !flipped;
  document.getElementById('card-inner').classList.toggle('flipped', flipped);
}
function next() { if (idx < deck.length - 1) { idx++; renderCard(); } }
function prev() { if (idx > 0) { idx--; renderCard(); } }
function shuffleDeck() {
  for (let i = deck.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  idx = 0; renderCard();
}
function resetDeck() { idx = 0; flipped = false; renderCard(); }

// Build home grid
function buildHome() {
  const grid = document.getElementById('subject-grid');
  grid.innerHTML = '';
  Object.entries(SUBJECTS).forEach(([key, sub]) => {
    const card = document.createElement('div');
    card.className = 'subject-card';
    card.style.cssText += `--accent:${sub.color}`;
    card.querySelector ? null : null;
    const count = sub.cards.length;
    card.innerHTML = `
      <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${sub.color};border-radius:12px 12px 0 0"></div>
      <div class="subject-icon">${sub.icon}</div>
      <div class="subject-name">${sub.label}</div>
      ${sub.unit ? `<div class="subject-unit">${sub.unit}</div>` : ''}
      <div class="subject-meta">${count ? count + ' cards' : ''}</div>
      ${!count ? '<div class="empty-badge">coming soon</div>' : ''}
    `;
    card.style.cursor = count ? 'pointer' : 'default';
    card.style.opacity = count ? '1' : '.55';
    if (count) card.onclick = () => openSubject(key);
    card.onmouseenter = () => { if(count) card.style.borderColor = sub.color + '60'; };
    card.onmouseleave = () => { card.style.borderColor = ''; };
    grid.appendChild(card);
  });
}

document.addEventListener('keydown', e => {
  if (document.getElementById('study').style.display === 'none') return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
});

buildHome();
</script>
</body>
</html>
